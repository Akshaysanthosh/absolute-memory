name: Feature request
description: Suggest an improvement to the self-hosted app.
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you handle it today?
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful change let you do?
      description: Describe the result you need, including any constraints.
    validations:
      required: true
