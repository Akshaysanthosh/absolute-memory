version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tiptap:
        patterns: ['@tiptap/*']
      aws-sdk:
        patterns: ['@aws-sdk/*']
      stylex:
        patterns: ['@stylexjs/*']
      fonts:
        patterns: ['@fontsource*']
      astryx:
        patterns: ['@astryxdesign/*']
      pglite:
        patterns: ['@electric-sql/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
