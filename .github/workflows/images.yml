name: Release images
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inspect the local image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker build --platform "$PLATFORM" -t absolute-memory:release .
          docker run --rm --entrypoint ffmpeg absolute-memory:release -version
          docker run --rm --entrypoint yt-dlp absolute-memory:release --version
          docker run --rm --entrypoint node absolute-memory:release -p 'process.platform + "/" + process.arch'

  publish:
    if: github.ref_type == 'tag' && vars.PUBLISH_IMAGES == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish the release image with provenance
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --attest type=provenance,mode=max \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --push --tag "$image" .
