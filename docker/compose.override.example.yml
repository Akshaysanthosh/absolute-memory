x-s3: &storage
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-absolute-memory}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: 'true'

services:
  minio:
    image: ${MINIO_IMAGE:-minio:local}
    profiles: [minio]
    command: [server, /storage, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio:/storage
    ports:
      - '127.0.0.1:9001:9001'
  web:
    environment: *storage
  worker:
    environment: *storage

volumes:
  minio:
