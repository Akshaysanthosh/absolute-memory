<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d"><title id="t">How Absolute Memory works</title><desc id="d">Four stages: capture anything; understand it as readable text, transcripts and numbered passages; remember it on your server; recall it by search, cited answers and MCP.</desc><rect x="0.5" y="0.5" width="1279" height="469" rx="20" fill="#F8F7F3" stroke="#E4E5DC"/><rect x="32" y="40" width="280" height="390" rx="18" fill="#FFFFFF" stroke="#E4E5DC"/><rect x="32" y="40" width="280" height="6" rx="3" fill="#8A1030"/><circle cx="68" cy="80" r="16" fill="#8A1030"/><text x="68" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFE2EB">1</text><text x="94" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#20332F">Capture</text><text x="94" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#767676">Anything, from anywhere</text><rect x="46" y="130" width="252" height="40" rx="10" fill="#FFE2EB"/><circle cx="60" cy="150" r="3.5" fill="#8A1030"/><text x="72" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Paste a link or upload a file</text><rect x="46" y="188" width="252" height="40" rx="10" fill="#FFE2EB"/><circle cx="60" cy="208" r="3.5" fill="#8A1030"/><text x="72" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">YouTube and podcast links</text><rect x="46" y="246" width="252" height="40" rx="10" fill="#FFE2EB"/><circle cx="60" cy="266" r="3.5" fill="#8A1030"/><text x="72" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Browser extension and quotes</text><rect x="46" y="304" width="252" height="40" rx="10" fill="#FFE2EB"/><circle cx="60" cy="324" r="3.5" fill="#8A1030"/><text x="72" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Pocket and Readwise imports</text><rect x="46" y="362" width="252" height="40" rx="10" fill="#FFE2EB"/><circle cx="60" cy="382" r="3.5" fill="#8A1030"/><text x="72" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">HTTP API, CLI and MCP</text><path d="M316 235 h18" stroke="#767676" stroke-width="1.6"/><path d="M332 230 l6 5 -6 5" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="316" cy="235" r="3.5" fill="#E60023" opacity="0"><animate attributeName="cx" values="316;334" dur="1.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle><rect x="344" y="40" width="280" height="390" rx="18" fill="#FFFFFF" stroke="#E4E5DC"/><rect x="344" y="40" width="280" height="6" rx="3" fill="#1D3F7A"/><circle cx="380" cy="80" r="16" fill="#1D3F7A"/><text x="380" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#E3EEFF">2</text><text x="406" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#20332F">Understand</text><text x="406" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#767676">Turned into text you can cite</text><rect x="358" y="130" width="252" height="40" rx="10" fill="#E3EEFF"/><circle cx="372" cy="150" r="3.5" fill="#1D3F7A"/><text x="384" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Readable article text</text><rect x="358" y="188" width="252" height="40" rx="10" fill="#E3EEFF"/><circle cx="372" cy="208" r="3.5" fill="#1D3F7A"/><text x="384" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Captions or transcription</text><rect x="358" y="246" width="252" height="40" rx="10" fill="#E3EEFF"/><circle cx="372" cy="266" r="3.5" fill="#1D3F7A"/><text x="384" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Text from PDFs and images</text><rect x="358" y="304" width="252" height="40" rx="10" fill="#E3EEFF"/><circle cx="372" cy="324" r="3.5" fill="#1D3F7A"/><text x="384" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Numbered, timed passages</text><rect x="358" y="362" width="252" height="40" rx="10" fill="#E3EEFF"/><circle cx="372" cy="382" r="3.5" fill="#1D3F7A"/><text x="384" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Tags, summaries, embeddings</text><path d="M628 235 h18" stroke="#767676" stroke-width="1.6"/><path d="M644 230 l6 5 -6 5" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="628" cy="235" r="3.5" fill="#E60023" opacity="0"><animate attributeName="cx" values="628;646" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="656" y="40" width="280" height="390" rx="18" fill="#FFFFFF" stroke="#E4E5DC"/><rect x="656" y="40" width="280" height="6" rx="3" fill="#145A3A"/><circle cx="692" cy="80" r="16" fill="#145A3A"/><text x="692" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#DDF7EA">3</text><text x="718" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#20332F">Remember</text><text x="718" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#767676">Kept on your server</text><rect x="670" y="130" width="252" height="40" rx="10" fill="#DDF7EA"/><circle cx="684" cy="150" r="3.5" fill="#145A3A"/><text x="696" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Library with topics</text><rect x="670" y="188" width="252" height="40" rx="10" fill="#DDF7EA"/><circle cx="684" cy="208" r="3.5" fill="#145A3A"/><text x="696" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Reader and highlights</text><rect x="670" y="246" width="252" height="40" rx="10" fill="#DDF7EA"/><circle cx="684" cy="266" r="3.5" fill="#145A3A"/><text x="696" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Original files kept</text><rect x="670" y="304" width="252" height="40" rx="10" fill="#DDF7EA"/><circle cx="684" cy="324" r="3.5" fill="#145A3A"/><text x="696" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Graph of people and ideas</text><rect x="670" y="362" width="252" height="40" rx="10" fill="#DDF7EA"/><circle cx="684" cy="382" r="3.5" fill="#145A3A"/><text x="696" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Lite or PostgreSQL + pgvector</text><path d="M940 235 h18" stroke="#767676" stroke-width="1.6"/><path d="M956 230 l6 5 -6 5" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="940" cy="235" r="3.5" fill="#E60023" opacity="0"><animate attributeName="cx" values="940;958" dur="1.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle><rect x="968" y="40" width="280" height="390" rx="18" fill="#FFFFFF" stroke="#E4E5DC"/><rect x="968" y="40" width="280" height="6" rx="3" fill="#4B2A86"/><circle cx="1004" cy="80" r="16" fill="#4B2A86"/><text x="1004" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#EFE6FF">4</text><text x="1030" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#20332F">Recall</text><text x="1030" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#767676">Find it the way you remember it</text><rect x="982" y="130" width="252" height="40" rx="10" fill="#EFE6FF"/><circle cx="996" cy="150" r="3.5" fill="#4B2A86"/><text x="1008" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Search by words or meaning</text><rect x="982" y="188" width="252" height="40" rx="10" fill="#EFE6FF"/><circle cx="996" cy="208" r="3.5" fill="#4B2A86"/><text x="1008" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Ask with passage citations</text><rect x="982" y="246" width="252" height="40" rx="10" fill="#EFE6FF"/><circle cx="996" cy="266" r="3.5" fill="#4B2A86"/><text x="1008" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Jump to the line or minute</text><rect x="982" y="304" width="252" height="40" rx="10" fill="#EFE6FF"/><circle cx="996" cy="324" r="3.5" fill="#4B2A86"/><text x="1008" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Your AI tools via MCP</text><rect x="982" y="362" width="252" height="40" rx="10" fill="#EFE6FF"/><circle cx="996" cy="382" r="3.5" fill="#4B2A86"/><text x="1008" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#20332F">Portable, documented export</text></svg>
