" y="188" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="372" cy="208" r="3.5" fill="#344F48"/><text x="384" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Captions or transcription</text><rect x="358" y="246" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="372" cy="266" r="3.5" fill="#344F48"/><text x="384" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Text from PDFs and images</text><rect x="358" y="304" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="372" cy="324" r="3.5" fill="#344F48"/><text x="384" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Numbered, timed passages</text><rect x="358" y="362" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="372" cy="382" r="3.5" fill="#344F48"/><text x="384" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Tags, summaries, embeddings</text><path d="M628 235 h18" stroke="#344F48" stroke-width="1.6"/><path d="M644 230 l6 5 -6 5" fill="none" stroke="#344F48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="628" cy="235" r="3" fill="#344F48" opacity="0"><animate attributeName="cx" values="628;646" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="656" y="40" width="280" height="390" rx="18" fill="#FFFFFF" stroke="#DDDFDA"/><circle cx="692" cy="78" r="16" fill="#E7EEEA"/><text x="692" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#344F48">3</text><text x="718" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#242824">Remember</text><text x="718" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#929A95">Kept on your server</text><line x1="676" y1="118" x2="916" y2="118" stroke="#DDDFDA"/><rect x="670" y="130" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="684" cy="150" r="3.5" fill="#344F48"/><text x="696" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Library with topics</text><rect x="670" y="188" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="684" cy="208" r="3.5" fill="#344F48"/><text x="696" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Reader and highlights</text><rect x="670" y="246" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="684" cy="266" r="3.5" fill="#344F48"/><text x="696" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Original files kept</text><rect x="670" y="304" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="684" cy="324" r="3.5" fill="#344F48"/><text x="696" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Graph of people and ideas</text><rect x="670" y="362" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="684" cy="382" r="3.5" fill="#344F48"/><text x="696" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Lite or PostgreSQL + pgvector</text><path d="M940 235 h18" stroke="#344F48" stroke-width="1.6"/><path d="M956 230 l6 5 -6 5" fill="none" stroke="#344F48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="940" cy="235" r="3" fill="#344F48" opacity="0"><animate attributeName="cx" values="940;958" dur="1.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle><rect x="968" y="40" width="280" height="390" rx="18" fill="#FFFFFF" stroke="#DDDFDA"/><circle cx="1004" cy="78" r="16" fill="#E7EEEA"/><text x="1004" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#344F48">4</text><text x="1030" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#242824">Recall</text><text x="1030" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#929A95">Find it the way you remember it</text><line x1="988" y1="118" x2="1228" y2="118" stroke="#DDDFDA"/><rect x="982" y="130" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="996" cy="150" r="3.5" fill="#344F48"/><text x="1008" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Search by words or meaning</text><rect x="982" y="188" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="996" cy="208" r="3.5" fill="#344F48"/><text x="1008" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Ask with passage citations</text><rect x="982" y="246" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="996" cy="266" r="3.5" fill="#344F48"/><text x="1008" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#242824">Jump to the line or minute</text><rect x="982" y="304" width="252" height="40" rx="10" fill="#F1F2EF"/><circle cx="996" cy="324" r="3.5" fill="#344F48"/><text x="1008" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-seri