"#E60023" opacity="0"><animate attributeName="cx" values="940;958" dur="1.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle><rect x="968" y="40" width="280" height="390" rx="18" fill="#14161A" stroke="#2A2F3A"/><rect x="968" y="40" width="280" height="6" rx="3" fill="#EFE6FF"/><circle cx="1004" cy="80" r="16" fill="#EFE6FF"/><text x="1004" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2148">4</text><text x="1030" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#F8F7F3">Recall</text><text x="1030" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8A93A6">Find it the way you remember it</text><rect x="982" y="130" width="252" height="40" rx="10" fill="#2B2148"/><circle cx="996" cy="150" r="3.5" fill="#EFE6FF"/><text x="1008" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Search by words or meaning</text><rect x="982" y="188" width="252" height="40" rx="10" fill="#2B2148"/><circle cx="996" cy="208" r="3.5" fill="#EFE6FF"/><text x="1008" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Ask with passage citations</text><rect x="982" y="246" width="252" height="40" rx="10" fill="#2B2148"/><circle cx="996" cy="266" r="3.5" fill="#EFE6FF"/><text x="1008" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Jump to the line or minute</text><rect x="982" y="304" width="252" height="40" rx="10" fill="#2B2148"/><circle cx="996" cy="324" r="3.5" fill="#EFE6FF"/><text x="1008" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Your AI tools via MCP</text><rect x="982" y="362" width="252" height="40" rx="10" fill="#2B2148"/><circle cx="996" cy="382" r="3.5" fill="#EFE6FF"/><text x="1008" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Portable, documented export</text></svg>
