<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d"><title id="t">How Absolute Memory works</title><desc id="d">Four stages: capture anything; understand it as readable text, transcripts and numbered passages; remember it on your server; recall it by search, cited answers and MCP.</desc><rect x="0.5" y="0.5" width="1279" height="469" rx="20" fill="#0E1220" stroke="#2A2F3A"/><rect x="32" y="40" width="280" height="390" rx="18" fill="#14161A" stroke="#2A2F3A"/><rect x="32" y="40" width="280" height="6" rx="3" fill="#FFE2EB"/><circle cx="68" cy="80" r="16" fill="#FFE2EB"/><text x="68" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5A0A24">1</text><text x="94" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#F8F7F3">Capture</text><text x="94" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8A93A6">Anything, from anywhere</text><rect x="46" y="130" width="252" height="40" rx="10" fill="#5A0A24"/><circle cx="60" cy="150" r="3.5" fill="#FFE2EB"/><text x="72" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Paste a link or upload a file</text><rect x="46" y="188" width="252" height="40" rx="10" fill="#5A0A24"/><circle cx="60" cy="208" r="3.5" fill="#FFE2EB"/><text x="72" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">YouTube and podcast links</text><rect x="46" y="246" width="252" height="40" rx="10" fill="#5A0A24"/><circle cx="60" cy="266" r="3.5" fill="#FFE2EB"/><text x="72" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Browser extension and quotes</text><rect x="46" y="304" width="252" height="40" rx="10" fill="#5A0A24"/><circle cx="60" cy="324" r="3.5" fill="#FFE2EB"/><text x="72" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Pocket and Readwise imports</text><rect x="46" y="362" width="252" height="40" rx="10" fill="#5A0A24"/><circle cx="60" cy="382" r="3.5" fill="#FFE2EB"/><text x="72" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">HTTP API, CLI and MCP</text><path d="M316 235 h18" stroke="#8A93A6" stroke-width="1.6"/><path d="M332 230 l6 5 -6 5" fill="none" stroke="#8A93A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="316" cy="235" r="3.5" fill="#E60023" opacity="0"><animate attributeName="cx" values="316;334" dur="1.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle><rect x="344" y="40" width="280" height="390" rx="18" fill="#14161A" stroke="#2A2F3A"/><rect x="344" y="40" width="280" height="6" rx="3" fill="#E3EEFF"/><circle cx="380" cy="80" r="16" fill="#E3EEFF"/><text x="380" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B2A4A">2</text><text x="406" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#F8F7F3">Understand</text><text x="406" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8A93A6">Turned into text you can cite</text><rect x="358" y="130" width="252" height="40" rx="10" fill="#1B2A4A"/><circle cx="372" cy="150" r="3.5" fill="#E3EEFF"/><text x="384" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#F8F7F3">Readable article text</t